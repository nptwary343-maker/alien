name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Run Python syntax check
        run: |
          python -m py_compile server.py

      - name: Run JavaScript lint (ESLint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm install -g eslint
          eslint CyberSecGame/script.js --max-warnings=0 || true

  build-apk:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable
          repository_root: .

      - name: List bin directory
        run: ls -la bin/ || echo "bin directory not found"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberGuardian-APK
          path: bin/*.apk

      - name: Get APK filename
        id: get_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK found at: $APK_PATH"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: ${{ steps.get_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
